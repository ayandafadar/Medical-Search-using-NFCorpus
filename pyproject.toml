[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-search-nfcorpus"
version = "1.0.0"
description = "FastAPI backend & Information Retrieval system for NFCorpus comparing TF-IDF, BM25, Semantic Search, and Hybrid RRF."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.2.0",
    "rank-bm25>=0.2.2",
    "spacy>=3.5.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "datasets>=2.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
